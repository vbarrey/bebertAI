# Logs kept to 3 files of 10 MB per service: they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The only service reached from outside: HTTPS on DOMAIN (docker/Caddyfile), the app behind it.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging

    # Google Drive keys; the values below override the localhost addresses of the .env.
    env_file:
      - path: .env
        required: false

    environment: &services-env
      DATABASE_URL: file:/app/data/database/bebertai.db
      DOCUMENTS_STORAGE_PATH: /app/data/documents
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      # Documents the worker indexes at once.
      INDEXING_CONCURRENCY: ${INDEXING_CONCURRENCY:-2}

    volumes:
      - data:/app/data

    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started

    # Ready once the migrations ran and the AI providers were initialized.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      start_period: 60s

  worker:
    build: .
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging
    command: ["npm", "run", "start:worker"]

    env_file:
      - path: .env
        required: false

    environment: *services-env

    volumes:
      - data:/app/data

    # Started after the app so that it finds the database migrated and the providers created.
    depends_on:
      app:
        condition: service_healthy

  # Every night at 3:00 UTC, the database, the documents and the Qdrant collections into ./backups on the server
  # (scripts/backup.ts: the 4 latest backups and the 2 latest Sunday ones are kept). By hand:
  # docker compose exec backup npm run backup (the script needs the react-server condition: see package.json)
  backup:
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging
    command:
      - sh
      - -c
      - while true; do sleep $$(( (97200 - $$(date +%s) % 86400) % 86400 + 1 )); npm run backup; done
    environment:
      <<: *services-env
      BACKUP_PATH: /app/backups
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - data:/app/data
      - ./backups:/app/backups
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *logging

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    logging: *logging
    volumes:
      - qdrant:/qdrant/storage

volumes:
  data:
  qdrant:
  caddy_data:
  caddy_config:
