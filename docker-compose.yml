# Logs kept to 3 files of 10 MB per service: they never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The only service reached from outside: HTTPS on DOMAIN (docker/Caddyfile), the app behind it.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging

    # Google Drive keys; the values below override the localhost addresses of the .env.
    env_file:
      - path: .env
        required: false

    environment: &services-env
      DATABASE_URL: file:/app/data/database/bebertai.db
      DOCUMENTS_STORAGE_PATH: /app/data/documents
      OLLAMA_HOST: http://ollama:11434
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen3:0.6b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      # Documents the worker indexes at once.
      INDEXING_CONCURRENCY: ${INDEXING_CONCURRENCY:-2}

    volumes:
      - data:/app/data

    # The models are synchronized at start-up: the default ones must be downloaded first.
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

    # Ready once the migrations ran and the AI providers were initialized.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      start_period: 60s

  worker:
    build: .
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging
    command: ["npm", "run", "start:worker"]

    env_file:
      - path: .env
        required: false

    environment: *services-env

    volumes:
      - data:/app/data

    # Started after the app so that it finds the database migrated and the providers created.
    depends_on:
      app:
        condition: service_healthy

  # Every night at 3:00 UTC, the database, the documents and the Qdrant collections into ./backups on the server
  # (scripts/backup.ts: the 4 latest backups and the 2 latest Sunday ones are kept). By hand:
  # docker compose exec backup npx tsx scripts/backup.ts
  backup:
    image: bebert-ai:latest
    restart: unless-stopped
    logging: *logging
    command:
      - sh
      - -c
      - while true; do sleep $$(( (97200 - $$(date +%s) % 86400) % 86400 + 1 )); npx tsx scripts/backup.ts; done
    environment:
      <<: *services-env
      BACKUP_PATH: /app/backups
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - data:/app/data
      - ./backups:/app/backups
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging: *logging

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    logging: *logging
    volumes:
      - qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    logging: *logging
    volumes:
      - ollama:/root/.ollama

    # Shared by every user. Prudent values for a GPU of about 12 GB, to raise with a bigger one:
    # requests answered at once by a model (each one reserves its context in memory),
    # models kept loaded (a chat model and the embedding model), how long an unused model stays loaded.
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}

    # NVIDIA GPU; remove this block on a machine without one, Ollama then runs on the CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s

  # Downloads the default generation and embedding models when missing, then exits.
  ollama-pull:
    image: ollama/ollama
    entrypoint:
      - sh
      - -c
      - for model in "$$GENERATION_MODEL" "$$EMBEDDING_MODEL"; do ollama show "$$model" > /dev/null 2>&1 || ollama pull "$$model" || exit 1; done

    environment:
      OLLAMA_HOST: http://ollama:11434
      GENERATION_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen3:0.6b}
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}

    depends_on:
      ollama:
        condition: service_healthy

volumes:
  data:
  qdrant:
  ollama:
  caddy_data:
  caddy_config:
